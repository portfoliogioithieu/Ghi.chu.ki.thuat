<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GeoSketch Studio — Vở nháp Hình học</title>
</script><style>
:root{
  --bg:#eef1f6;--panel:#ffffff;--panel2:#f4f6fa;--text:#141821;--muted:#6b7280;
  --border:#e5e8ef;--primary:#2563eb;--primary-soft:#e8efff;--danger:#ef4444;
  --radius:16px;--shadow:0 18px 45px rgba(15,23,42,.10);--shadow-sm:0 4px 14px rgba(15,23,42,.06);
}
body.dark{--bg:#0d0f13;--panel:#16191f;--panel2:#1f232b;--text:#edf0f5;--muted:#98a1b0;--border:#2a2f39;--primary:#3b82f6;--primary-soft:#1d2a44;--danger:#ef4444;--shadow:0 18px 45px rgba(0,0,0,.45);--shadow-sm:0 4px 14px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;touch-action:manipulation}
.app{display:grid;grid-template-columns:74px 1fr 300px;grid-template-rows:auto 1fr;height:100dvh}
header{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);padding-top:max(10px,env(safe-area-inset-top));z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:16px;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.brand small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.header-actions{display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none}
.header-actions::-webkit-scrollbar{display:none}
.hbtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);font-size:13px;font-weight:650;white-space:nowrap;transition:.15s}
.hbtn:active{transform:scale(.96)}
.hbtn:hover{border-color:var(--primary);color:var(--primary)}
.hbtn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.hbtn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.status{font-size:11.5px;color:var(--muted);max-width:190px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rail{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 7px;overflow-y:auto;scrollbar-width:none;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.rail::-webkit-scrollbar{display:none}
.tool{width:52px;height:48px;border-radius:13px;display:grid;place-items:center;background:var(--panel2);border:1px solid transparent;font-size:18px;position:relative;flex:0 0 auto;transition:.15s}
.tool:hover{border-color:var(--primary)}
.tool:active{transform:scale(.94)}
.tool.active{background:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.28)}
.tool small{position:absolute;bottom:2px;font-size:7.5px;font-weight:800;opacity:.72;letter-spacing:.02em}
.sep{width:32px;height:1px;background:var(--border);margin:5px 0;flex:0 0 auto}

.stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px;gap:12px}
.canvas-card{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative;min-height:0}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
canvas.move{cursor:grab}
canvas.text{cursor:text}
.note-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:10px 14px}
.note-card h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.note{width:100%;height:64px;resize:none;border:none;background:transparent;outline:none;font-size:14.5px;line-height:1.5}

.inspector{background:var(--panel);border-left:1px solid var(--border);padding:14px;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
.inspector::-webkit-scrollbar{display:none}
.panel{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px}
.panel h3{margin:0 0 10px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{font-size:10px;font-weight:800;color:var(--primary);background:var(--primary-soft);padding:3px 8px;border-radius:999px}
.props{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prop{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 9px;min-width:0}
.prop label{font-size:11px;color:var(--muted);font-weight:750;white-space:nowrap}
.prop.full{grid-column:1/-1}
input[type=color]{width:36px;height:28px;border:none;background:none;padding:0}
input[type=range]{width:100%;accent-color:var(--primary)}
input[type=number],input[type=text]{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 8px;width:100%;min-width:0;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.abtn{padding:9px;border-radius:10px;background:var(--panel);border:1px solid var(--border);font-size:12.5px;font-weight:750;text-align:center;transition:.15s}
.abtn:active{transform:scale(.96)}
.abtn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.abtn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.info{font-size:11.5px;color:var(--muted);line-height:1.5}
.hidden{display:none!important}
.pages{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto}
.page-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--border);font-size:12.5px;font-weight:650;cursor:pointer}
.page-item.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.page-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:1024px){
  .app{grid-template-columns:60px 1fr;grid-template-rows:auto 1fr auto}
  header{grid-column:1/3}
  .inspector{grid-column:1/3;grid-row:3;border-left:none;border-top:1px solid var(--border);max-height:42dvh}
  .rail{grid-row:2}
  .stage{grid-row:2}
  .brand small{display:none}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">📐</div><div>GeoSketch Studio<small>Hình học • Vở nháp</small></div></div>
  <div class="header-actions">
    <span class="status" id="status">Sẵn sàng</span>
    <button class="hbtn" id="addPage">＋ Trang</button>
    <button class="hbtn" id="renamePage">✏️ Đổi tên</button>
    <button class="hbtn" id="resetPage">🔄 Reset</button>
    <button class="hbtn danger" id="deletePage">🗑 Xóa</button>
    <button class="hbtn" id="export">⬇ PNG</button>
    <button class="hbtn" id="gridBtn">▦ Lưới</button>
    <button class="hbtn" id="themeBtn">🌙 Tối</button>
  </div>
</header>

<nav class="rail">
  <button class="tool active" data-tool="select" title="Chọn / di chuyển"><span>🖱️</span><small>Chọn</small></button>
  <button class="tool" data-tool="pen" title="Vẽ tay"><span>✏️</span><small>Vẽ</small></button>
  <button class="tool" data-tool="line" title="Đường thẳng"><span>／</span><small>Thẳng</small></button>
  <button class="tool" data-tool="arc" title="Cung tròn"><span>⌒</span><small>Cung</small></button>
  <button class="tool" data-tool="arrow" title="Mũi tên"><span>→</span><small>Mũi tên</small></button>
  <div class="sep"></div>
  <button class="tool" data-tool="dimension" title="Đường kích thước"><span>↔</span><small>Kích thước</small></button>
  <button class="tool" data-tool="diameter" title="Đường kính"><span>⌀</span><small>Đ.kính</small></button>
  <button class="tool" data-tool="point" title="Tạo điểm"><span>•</span><small>Điểm</small></button>
  <button class="tool" data-tool="polygon" title="Đa giác đều"><span>⬠</span><small>Đa giác</small></button>
  <button class="tool" data-tool="triangle" title="Tam giác đều"><span>△</span><small>Tam giác</small></button>
  <button class="tool" data-tool="rect" title="Hình chữ nhật"><span>▭</span><small>Chữ nhật</small></button>
  <button class="tool" data-tool="square" title="Hình vuông"><span>◻</span><small>Vuông</small></button>
  <button class="tool" data-tool="circle" title="Hình tròn"><span>◯</span><small>Tròn</small></button>
  <button class="tool" data-tool="ellipse" title="Hình elip"><span>⬭</span><small>Elip</small></button>
  <div class="sep"></div>
  <button class="tool" data-tool="text" title="Gõ chữ"><span>🅰️</span><small>Chữ</small></button>
  <button class="tool" data-tool="eraser" title="Tẩy"><span>🧽</span><small>Tẩy</small></button>
  <button class="tool" id="undoBtn" title="Hoàn tác"><span>↩️</span><small>Undo</small></button>
  <button class="tool" id="deleteSelectedBtn" title="Xóa mục chọn"><span>✖️</span><small>Xóa</small></button>
</nav>

<section class="stage">
  <div class="canvas-card"><canvas id="board"></canvas></div>
  <div class="note-card"><h4>Ghi chú</h4><textarea class="note" id="note" placeholder="Ghi chú công thức, đáp số hoặc nhận xét..."></textarea></div>
</section>

<aside class="inspector">
  <div class="panel">
    <h3>Trang<div class="badge" id="pageBadge">1/1</div></h3>
    <div class="pages" id="pageList"></div>
  </div>

  <div class="panel">
    <h3><span id="propTitle">Thuộc tính</span><span class="badge" id="propBadge">Vẽ hình học</span></h3>
    <div id="createProps">
      <div id="geometryProps" class="props">
        <div class="prop"><label>Màu</label><input type="color" id="color" value="#111827"></div>
        <div class="prop"><label>Độ dày</label><input type="range" id="size" min="1" max="30" value="4"></div>
        <div class="prop"><label>Tô màu</label><input type="checkbox" id="fill"></div>
        <div class="prop"><label>Viền</label><input type="checkbox" id="stroke" checked></div>
      </div>
      <div id="dimensionProps" class="props hidden">
        <div class="prop"><label>Màu</label><input type="color" id="dimColor" value="#2563eb"></div>
        <div class="prop"><label>Độ dày</label><input type="range" id="dimSize" min="1" max="12" value="2"></div>
        <div class="prop full"><label>Giá trị</label><input type="text" id="dimValue" placeholder="VD: 12 cm"></div>
        <div class="prop"><label>Cỡ nhãn</label><input type="number" id="dimFont" min="10" max="60" value="16"></div>
      </div>
      <div id="textProps" class="props hidden">
        <div class="prop"><label>Màu</label><input type="color" id="textColor" value="#111827"></div>
        <div class="prop"><label>Cỡ chữ</label><input type="number" id="fontSize" min="10" max="120" value="26"></div>
        <div class="prop full"><label>Nội dung</label><input type="text" id="textContent" placeholder="Nhập chữ"></div>
        <div class="prop"><label>Đậm</label><input type="checkbox" id="bold" checked></div>
      </div>
      <div id="pointProps" class="props hidden">
        <div class="prop"><label>Màu</label><input type="color" id="pointColor" value="#ef4444"></div>
        <div class="prop"><label>Cỡ</label><input type="number" id="pointSize" min="3" max="30" value="7"></div>
        <div class="prop full"><label>Tên điểm</label><input type="text" id="pointLabel" placeholder="A, B, C..."></div>
      </div>
    </div>

    <div id="editProps" class="hidden">
      <div class="props">
        <div class="prop"><label>Màu</label><input type="color" id="editColor" value="#111827"></div>
        <div class="prop"><label>Độ dày/cỡ</label><input type="number" id="editSize" min="1" max="200" value="4"></div>
        <div class="prop full"><label>Nội dung</label><input type="text" id="editText" placeholder="Chữ / nhãn / kích thước"></div>
        <div class="prop"><label>Tùy chọn</label><input type="checkbox" id="editFlag"><span style="font-size:11.5px" id="editFlagLabel">Tô màu</span></div>
      </div>
      <div class="actions">
        <button class="abtn primary" id="applyProps">✔ Áp dụng</button>
        <button class="abtn" id="copySelected">⧉ Nhân bản</button>
        <button class="abtn" id="duplicateOffset">⇄ Copy lệch</button>
        <button class="abtn danger" id="deleteEdit">🗑 Xóa</button>
      </div>
    </div>
    <div class="info" id="selectionInfo" style="margin-top:10px">Chưa chọn mục nào</div>
  </div>

  <div class="panel">
    <h3>Công cụ</h3>
    <div class="info">
      • <b>Chọn nhiều:</b> kéo khung trên vùng trống.<br>
      • <b>Đa giác:</b> chọn số cạnh rồi nhấn giữ, kéo.<br>
      • <b>Kích thước / Đường kính:</b> kéo rồi nhập giá trị.<br>
      • <b>Nhấp đúp tên trang:</b> đổi tên trang.
    </div>
  </div>
</aside>
</div>

<script>
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d',{desynchronized:true});
const cache=document.createElement('canvas'),cctx=cache.getContext('2d');
const statusEl=document.getElementById('status'),note=document.getElementById('note');
const propTitle=document.getElementById('propTitle'),propBadge=document.getElementById('propBadge'),selectionInfo=document.getElementById('selectionInfo');
const pageBadge=document.getElementById('pageBadge'),pageList=document.getElementById('pageList');
const createProps=document.getElementById('createProps'),editProps=document.getElementById('editProps');
const panels={geometry:document.getElementById('geometryProps'),dimension:document.getElementById('dimensionProps'),text:document.getElementById('textProps'),point:document.getElementById('pointProps')};
const els={color:document.getElementById('color'),size:document.getElementById('size'),fill:document.getElementById('fill'),stroke:document.getElementById('stroke'),dimColor:document.getElementById('dimColor'),dimSize:document.getElementById('dimSize'),dimValue:document.getElementById('dimValue'),dimFont:document.getElementById('dimFont'),textColor:document.getElementById('textColor'),fontSize:document.getElementById('fontSize'),bold:document.getElementById('bold'),textContent:document.getElementById('textContent'),pointColor:document.getElementById('pointColor'),pointSize:document.getElementById('pointSize'),pointLabel:document.getElementById('pointLabel'),editColor:document.getElementById('editColor'),editSize:document.getElementById('editSize'),editText:document.getElementById('editText'),editFlag:document.getElementById('editFlag'),editFlagLabel:document.getElementById('editFlagLabel')};

let pages=[],current=0,tool='select',selected=new Set(),polygonSides=6;
let pointerId=null,mode='none',dragStart=null,marquee=null,creating=false;
let grid=false,dark=false,saveTimer,activeIndices=new Set(),cacheValid=false,queued=false;

function blankPage(name){return{name:name||('Trang '+(pages.length+1)),shapes:[],note:'',undo:[]}}
function load(){
  try{pages=JSON.parse(localStorage.getItem('geosketchStudio')||'[]')}catch(e){pages=[]}
  if(!Array.isArray(pages)||!pages.length)pages=[blankPage('Trang 1')];
  dark=localStorage.getItem('geosketchDark')==='1';grid=localStorage.getItem('geosketchGrid')==='1';
  document.body.classList.toggle('dark',dark);selectPage(0);
}
function save(){localStorage.setItem('geosketchDark',dark?'1':'0');localStorage.setItem('geosketchGrid',grid?'1':'0');localStorage.setItem('geosketchStudio',JSON.stringify(pages));statusEl.textContent='Đã lưu • '+new Date().toLocaleTimeString('vi-VN')}
function scheduleSave(){clearTimeout(saveTimer);statusEl.textContent='Sẽ lưu sau khi ngừng vẽ...';saveTimer=setTimeout(save,800)}

function renderPages(){
  pageList.innerHTML='';
  pages.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='page-item'+(i===current?' active':'');
    d.innerHTML='<span>'+p.name+'</span>';
    d.onclick=()=>selectPage(i);
    d.ondblclick=()=>renamePage(i);
    pageList.appendChild(d);
  });
  pageBadge.textContent=(current+1)+'/'+pages.length;
}
function renamePage(i){const p=pages[i],n=prompt('Đổi tên trang:',p.name);if(n===null)return;if(n.trim()){p.name=n.trim();renderPages();scheduleSave()}}
function selectPage(i){storeNote();current=i;selected.clear();activeIndices.clear();cacheValid=false;note.value=pages[i].note||'';renderPages();requestRender();scheduleSave()}
function storeNote(){if(pages[current])pages[current].note=note.value}

function resize(){
  const r=canvas.getBoundingClientRect();
  canvas.width=Math.max(1,Math.round(r.width*devicePixelRatio));
  canvas.height=Math.max(1,Math.round(r.height*devicePixelRatio));
  cache.width=canvas.width;cache.height=canvas.height;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  cctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.lineCap=ctx.lineJoin=cctx.lineCap=cctx.lineJoin='round';
  cacheValid=false;requestRender();
}
addEventListener('resize',()=>requestAnimationFrame(resize));
addEventListener('orientationchange',()=>setTimeout(resize,120));

function requestRender(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;render()})}

function render(){
  ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
  if(!cacheValid)buildCache();
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(cache,0,0);ctx.restore();
  pages[current].shapes.forEach((s,i)=>{if(activeIndices.has(i))drawShape(ctx,s)});
  selected.forEach(i=>drawSelection(pages[current].shapes[i]));
  if(marquee){ctx.save();ctx.strokeStyle='#2563eb';ctx.setLineDash([6,5]);ctx.lineWidth=1.5;ctx.strokeRect(marquee.x,marquee.y,marquee.w,marquee.h);ctx.fillStyle='rgba(37,99,235,.08)';ctx.fillRect(marquee.x,marquee.y,marquee.w,marquee.h);ctx.restore()}
}
function buildCache(){
  cctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
  if(grid)drawGrid(cctx);
  pages[current].shapes.forEach((s,i)=>{if(!activeIndices.has(i)&&!isOffscreen(s))drawShape(cctx,s)});
  cacheValid=true;
}
function drawGrid(c){c.save();c.strokeStyle=getComputedStyle(document.body).getPropertyValue('--border');c.lineWidth=1;for(let x=0;x<canvas.clientWidth;x+=32){c.beginPath();c.moveTo(x,0);c.lineTo(x,canvas.clientHeight);c.stroke()}for(let y=0;y<canvas.clientHeight;y+=32){c.beginPath();c.moveTo(0,y);c.lineTo(canvas.clientWidth,y);c.stroke()}c.restore()}
function isOffscreen(s){const b=bounds(s);return b.x>canvas.clientWidth||b.y>canvas.clientHeight||b.x+b.w<0||b.y+b.h<0}
function drawSelection(s){const b=bounds(s);ctx.save();ctx.setLineDash([6,5]);ctx.lineWidth=1.5;ctx.strokeStyle='#2563eb';ctx.strokeRect(b.x-8,b.y-8,b.w+16,b.h+16);ctx.restore()}

function applyStyle(s,c){c.lineWidth=s.size;c.strokeStyle=s.color;c.fillStyle=s.color;c.lineCap=c.lineJoin='round'}
function polygonPoints(s){return Array.from({length:s.sides},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/s.sides;return{x:s.cx+s.r*Math.cos(a),y:s.cy+s.r*Math.sin(a)}})}
function arrowHead(c,x,y,a,z){c.beginPath();c.moveTo(x,y);c.lineTo(x-z*Math.cos(a-.42),y-z*Math.sin(a-.42));c.moveTo(x,y);c.lineTo(x-z*Math.cos(a+.42),y-z*Math.sin(a+.42));c.stroke()}

function drawShape(c,s){
  applyStyle(s,c);
  if(s.type==='pen'){c.beginPath();s.points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke()}
  else if(s.type==='line'){c.beginPath();c.moveTo(s.x1,s.y1);c.lineTo(s.x2,s.y2);c.stroke()}
  else if(s.type==='arc'){const cx=(s.x1+s.x2)/2,cy=(s.y1+s.y2)/2,r=Math.hypot(s.x2-s.x1,s.y2-s.y1)/2,a1=Math.atan2(s.y1-cy,s.x1-cx),a2=Math.atan2(s.y2-cy,s.x2-cx);c.beginPath();c.arc(cx,cy,r,a1,a2,false);c.stroke()}
  else if(s.type==='arrow'){const a=Math.atan2(s.y2-s.y1,s.x2-s.x1),z=Math.max(12,s.size*3);c.beginPath();c.moveTo(s.x1,s.y1);c.lineTo(s.x2,s.y2);c.stroke();arrowHead(c,s.x2,s.y2,a,z)}
  else if(s.type==='dimension'||s.type==='diameter'){
    const a=Math.atan2(s.y2-s.y1,s.x2-s.x1),z=Math.max(10,s.size*3);
    c.beginPath();c.moveTo(s.x1,s.y1);c.lineTo(s.x2,s.y2);c.stroke();arrowHead(c,s.x1,s.y1,a+Math.PI,z);arrowHead(c,s.x2,s.y2,a,z);
    const mx=(s.x1+s.x2)/2,my=(s.y1+s.y2)/2;
    c.save();c.font='600 '+s.font+'px -apple-system,system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';
    const label=s.type==='diameter'?('⌀ '+s.value):s.value,w=c.measureText(label).width+14,h=s.font+12;
    c.fillStyle=dark?'rgba(22,25,31,.94)':'rgba(255,255,255,.94)';c.strokeStyle=s.color;c.lineWidth=1.4;
    c.beginPath();if(c.roundRect)c.roundRect(mx-w/2,my-h/2,w,h,8);else c.rect(mx-w/2,my-h/2,w,h);c.fill();c.stroke();
    c.fillStyle=s.color;c.fillText(label,mx,my);c.restore();
  }
  else if(s.type==='point'){c.beginPath();c.arc(s.x,s.y,s.r,0,Math.PI*2);c.fill();if(s.label){c.font='700 16px -apple-system,system-ui,sans-serif';c.textBaseline='middle';c.textAlign='left';c.fillText(s.label,s.x+s.r+7,s.y)}}
  else if(s.type==='text'){c.font=(s.bold?'700 ':'500 ')+s.fontSize+'px -apple-system,system-ui,sans-serif';c.textBaseline='top';c.textAlign='left';c.fillText(s.text,s.x,s.y)}
  else if(s.type==='rect'){if(s.fill)c.fillRect(s.x,s.y,s.w,s.h);if(s.stroke||!s.fill)c.strokeRect(s.x,s.y,s.w,s.h)}
  else if(s.type==='circle'){c.beginPath();c.arc(s.cx,s.cy,s.r,0,Math.PI*2);if(s.fill)c.fill();if(s.stroke||!s.fill)c.stroke()}
  else if(s.type==='ellipse'){c.beginPath();c.ellipse(s.cx,s.cy,s.rx,s.ry,0,0,Math.PI*2);if(s.fill)c.fill();if(s.stroke||!s.fill)c.stroke()}
  else if(s.type==='triangle'||s.type==='polygon'){
    const pts=s.type==='triangle'?[{x:s.cx,y:s.cy-s.r},{x:s.cx-s.r*.866,y:s.cy+s.r*.5},{x:s.cx+s.r*.866,y:s.cy+s.r*.5}]:polygonPoints(s);
    c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath();
    if(s.fill)c.fill();if(s.stroke||!s.fill)c.stroke();
  }
}

function bounds(s){
  if(s.type==='pen'){const xs=s.points.map(p=>p.x),ys=s.points.map(p=>p.y);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}
  if(['line','arc','arrow','dimension','diameter'].includes(s.type))return{x:Math.min(s.x1,s.x2),y:Math.min(s.y1,s.y2),w:Math.abs(s.x2-s.x1),h:Math.abs(s.y2-s.y1)};
  if(s.type==='point')return{x:s.x-s.r,y:s.y-s.r,w:s.r*2,h:s.r*2};
  if(s.type==='text'){ctx.font=(s.bold?'700 ':'500 ')+s.fontSize+'px -apple-system,system-ui,sans-serif';return{x:s.x,y:s.y,w:ctx.measureText(s.text).width,h:s.fontSize*1.25}}
  if(s.type==='rect')return{x:Math.min(s.x,s.x+s.w),y:Math.min(s.y,s.y+s.h),w:Math.abs(s.w),h:Math.abs(s.h)};
  if(['circle','triangle','polygon'].includes(s.type))return{x:s.cx-s.r,y:s.cy-s.r,w:s.r*2,h:s.r*2};
  if(s.type==='ellipse')return{x:s.cx-s.rx,y:s.cy-s.ry,w:s.rx*2,h:s.ry*2};
  return{x:0,y:0,w:0,h:0};
}
function hitTest(x,y){for(let i=pages[current].shapes.length-1;i>=0;i--){const b=bounds(pages[current].shapes[i]);if(x>=b.x-10&&x<=b.x+b.w+10&&y>=b.y-10&&y<=b.y+b.h+10)return i}return -1}
function inMarquee(s,m){const b=bounds(s);return b.x>=m.x&&b.y>=m.y&&b.x+b.w<=m.x+m.w&&b.y+b.h<=m.y+m.h}
function pushUndo(){pages[current].undo.push(JSON.stringify(pages[current].shapes));if(pages[current].undo.length>30)pages[current].undo.shift()}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function selectedShapes(){return[...selected].map(i=>pages[current].shapes[i])}
function commonType(){const a=selectedShapes();if(!a.length)return null;return a.every(s=>s.type===a[0].type)?a[0].type:'mixed'}

function updatePanel(){
  Object.values(panels).forEach(p=>p.classList.add('hidden'));
  const n=selected.size;
  selectionInfo.textContent=n===0?'Chưa chọn mục nào':n===1?'Đã chọn 1 mục — có thể chỉnh sửa':'Đã chọn '+n+' mục — chỉnh sửa hàng loạt';
  if(n>0){
    createProps.classList.add('hidden');editProps.classList.remove('hidden');
    const type=commonType(),f=selectedShapes()[0];
    propTitle.textContent='Chỉnh sửa mục';
    propBadge.textContent=type==='mixed'?'Nhiều loại':({pen:'Vẽ tay',line:'Đường',arc:'Cung',arrow:'Mũi tên',dimension:'Kích thước',diameter:'Đường kính',point:'Điểm',text:'Chữ',rect:'Chữ nhật',circle:'Tròn',ellipse:'Elip',triangle:'Tam giác',polygon:'Đa giác'}[type]||'Hình');
    els.editColor.value=f.color||'#111827';els.editSize.value=f.size||f.fontSize||f.r||4;
    els.editText.value=f.text||f.label||f.value||'';els.editFlag.checked=!!f.fill;
    els.editFlagLabel.textContent=type==='text'?'In đậm':(['dimension','diameter'].includes(type)?'Hiện nhãn':'Tô màu');
    return;
  }
  editProps.classList.add('hidden');createProps.classList.remove('hidden');
  let cat='geometry',title='Thuộc tính hình học',badge='Vẽ hình học';
  if(tool==='dimension'||tool==='diameter'){cat='dimension';title='Thuộc tính đường đo';badge=tool==='dimension'?'Kích thước':'Đường kính'}
  else if(tool==='text'){cat='text';title='Thuộc tính chữ';badge='Text'}
  else if(tool==='point'){cat='point';title='Thuộc tính điểm';badge='Điểm'}
  panels[cat].classList.remove('hidden');propTitle.textContent=title;propBadge.textContent=badge;
}

function baseProps(){
  if(tool==='dimension'||tool==='diameter')return{color:els.dimColor.value,size:+els.dimSize.value,font:+els.dimFont.value,value:els.dimValue.value.trim()};
  if(tool==='text')return{color:els.textColor.value,fontSize:+els.fontSize.value,bold:els.bold.checked,text:els.textContent.value.trim()};
  if(tool==='point')return{color:els.pointColor.value,r:+els.pointSize.value,label:els.pointLabel.value.trim()};
  return{color:els.color.value,size:+els.size.value,fill:els.fill.checked,stroke:els.stroke.checked};
}

canvas.addEventListener('pointerdown',e=>{
  if(pointerId!==null)return;pointerId=e.pointerId;canvas.setPointerCapture(pointerId);
  const p=pos(e);
  if(tool==='select'){
    const hit=hitTest(p.x,p.y);
    if(hit>=0){if(!selected.has(hit)){selected.clear();selected.add(hit)}mode='move';dragStart=p;activeIndices=new Set(selected);cacheValid=false;pushUndo();canvas.style.cursor='grabbing'}
    else{selected.clear();mode='marquee';marquee={x:p.x,y:p.y,w:0,h:0};dragStart=p}
    requestRender();updatePanel();return;
  }
  if(tool==='text'){const t=(els.textContent.value||prompt('Nhập chữ:')||'').trim();if(!t)return;pushUndo();pages[current].shapes.push({type:'text',text:t,x:p.x,y:p.y,...baseProps()});selected=new Set([pages[current].shapes.length-1]);activeIndices=new Set(selected);cacheValid=false;requestRender();updatePanel();scheduleSave();return}
  if(tool==='point'){pushUndo();pages[current].shapes.push({type:'point',x:p.x,y:p.y,...baseProps()});selected=new Set([pages[current].shapes.length-1]);activeIndices=new Set(selected);cacheValid=false;requestRender();updatePanel();scheduleSave();return}

  creating=true;dragStart=p;pushUndo();const b=baseProps();let s;
  if(tool==='pen')s={type:'pen',points:[p],...b};
  else if(['line','arc','arrow','dimension','diameter'].includes(tool))s={type:tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y,...b};
  else if(tool==='rect')s={type:'rect',x:p.x,y:p.y,w:1,h:1,...b};
  else if(tool==='square')s={type:'rect',x:p.x,y:p.y,w:1,h:1,...b};
  else if(tool==='circle')s={type:'circle',cx:p.x,cy:p.y,r:1,...b};
  else if(tool==='ellipse')s={type:'ellipse',cx:p.x,cy:p.y,rx:1,ry:1,...b};
  else if(tool==='triangle')s={type:'triangle',cx:p.x,cy:p.y,r:1,...b};
  else if(tool==='polygon')s={type:'polygon',sides:polygonSides,cx:p.x,cy:p.y,r:1,...b};
  pages[current].shapes.push(s);selected=new Set([pages[current].shapes.length-1]);activeIndices=new Set(selected);cacheValid=false;
});

canvas.addEventListener('pointermove',e=>{
  if(e.pointerId!==pointerId)return;const p=pos(e);
  if(mode==='move'&&selected.size){const dx=p.x-dragStart.x,dy=p.y-dragStart.y;activeIndices.forEach(i=>moveShape(pages[current].shapes[i],dx,dy));dragStart=p;requestRender();scheduleSave();return}
  if(mode==='marquee'&&marquee){marquee={x:Math.min(dragStart.x,p.x),y:Math.min(dragStart.y,p.y),w:Math.abs(p.x-dragStart.x),h:Math.abs(p.y-dragStart.y)};selected=new Set();pages[current].shapes.forEach((s,i)=>{if(inMarquee(s,marquee))selected.add(i)});requestRender();updatePanel();return}
  if(!creating)return;
  const s=pages[current].shapes[selected.values().next().value];if(!s)return;
  if(s.type==='pen'){const l=s.points[s.points.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)>2){s.points.push(p);requestRender();scheduleSave()}return}
  if(['line','arc','arrow','dimension','diameter'].includes(s.type)){s.x2=p.x;s.y2=p.y}
  else if(s.type==='rect'){if(tool==='square'){const d=Math.max(Math.abs(p.x-dragStart.x),Math.abs(p.y-dragStart.y));s.w=Math.sign(p.x-dragStart.x||1)*d;s.h=Math.sign(p.y-dragStart.y||1)*d}else{s.w=p.x-dragStart.x;s.h=p.y-dragStart.y}}
  else if(s.type==='circle')s.r=Math.hypot(p.x-dragStart.x,p.y-dragStart.y);
  else if(s.type==='ellipse'){s.rx=Math.abs(p.x-dragStart.x);s.ry=Math.abs(p.y-dragStart.y)}
  else if(s.type==='triangle'||s.type==='polygon')s.r=Math.max(1,Math.hypot(p.x-dragStart.x,p.y-dragStart.y));
  requestRender();scheduleSave();
});

function moveShape(s,dx,dy){
  if(s.type==='pen')s.points.forEach(p=>{p.x+=dx;p.y+=dy});
  else if(['line','arc','arrow','dimension','diameter'].includes(s.type)){s.x1+=dx;s.y1+=dy;s.x2+=dx;s.y2+=dy}
  else if(s.type==='point'||s.type==='text'){s.x+=dx;s.y+=dy}
  else if(s.type==='rect'){s.x+=dx;s.y+=dy}
  else if(['circle','ellipse','triangle','polygon'].includes(s.type)){s.cx+=dx;s.cy+=dy}
}

function endPointer(e){
  if(e.pointerId!==pointerId)return;pointerId=null;canvas.releasePointerCapture?.(e.pointerId);
  if(mode==='move'){mode='none';canvas.style.cursor=tool==='select'?'grab':'crosshair'}
  if(mode==='marquee'){mode='none';marquee=null}
  if(creating){
    creating=false;
    const idx=selected.values().next().value,s=pages[current].shapes[idx];
    if(s&&(s.type==='dimension'||s.type==='diameter')){
      const sug=Math.round(Math.hypot(s.x2-s.x1,s.y2-s.y1));
      const v=prompt(s.type==='diameter'?'Nhập đường kính:':'Nhập kích thước:',sug);
      if(v===null||!v.trim()){pages[current].shapes.splice(idx,1);selected.clear()}
      else s.value=v.trim();
    }
  }
  activeIndices.clear();cacheValid=false;requestRender();updatePanel();scheduleSave();
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
  tool=b.dataset.tool;selected.clear();activeIndices.clear();cacheValid=false;
  document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));
  canvas.className=tool==='select'?'move':tool==='text'?'text':'';
  if(tool==='polygon'){const n=parseInt(prompt('Nhập số cạnh (3-20):','6'),10);if(!n||n<3||n>20)return;polygonSides=n;statusEl.textContent='Đa giác '+n+' cạnh: nhấn giữ và kéo.'}
  else if(tool==='dimension')statusEl.textContent='Kích thước: kéo rồi nhập giá trị.';
  else if(tool==='diameter')statusEl.textContent='Đường kính: kéo qua hình tròn rồi nhập giá trị.';
  else statusEl.textContent='Công cụ: '+b.title;
  requestRender();updatePanel();
});

document.getElementById('undoBtn').onclick=()=>{const u=pages[current].undo.pop();if(!u)return;pages[current].shapes=JSON.parse(u);selected.clear();activeIndices.clear();cacheValid=false;requestRender();updatePanel();scheduleSave()};
document.getElementById('deleteSelectedBtn').onclick=()=>{if(!selected.size)return;pushUndo();pages[current].shapes=pages[current].shapes.filter((_,i)=>!selected.has(i));selected.clear();activeIndices.clear();cacheValid=false;requestRender();updatePanel();scheduleSave()};
document.getElementById('applyProps').onclick=()=>{
  if(!selected.size)return;pushUndo();const type=commonType();
  selectedShapes().forEach(s=>{s.color=els.editColor.value;
    if(s.type==='text')s.fontSize=Math.max(6,+els.editSize.value||s.fontSize);
    else if(s.type==='point')s.r=Math.max(2,+els.editSize.value||s.r);
    else if(s.type!=='pen')s.size=Math.max(1,+els.editSize.value||s.size);
    const t=els.editText.value.trim();
    if(s.type==='text'&&t)s.text=t;if(s.type==='point')s.label=t;
    if(['dimension','diameter'].includes(s.type)&&t)s.value=t;
    if(s.type==='text')s.bold=els.editFlag.checked;else if(['rect','circle','ellipse','triangle','polygon'].includes(s.type))s.fill=els.editFlag.checked;
  });
  cacheValid=false;requestRender();scheduleSave();
};
document.getElementById('copySelected').onclick=()=>{if(!selected.size)return;pushUndo();const cl=selectedShapes().map(s=>JSON.parse(JSON.stringify(s)));pages[current].shapes.push(...cl);selected=new Set(pages[current].shapes.slice(-cl.length).map((_,i)=>pages[current].shapes.length-cl.length+i));activeIndices=new Set(selected);cacheValid=false;requestRender();updatePanel();scheduleSave()};
document.getElementById('duplicateOffset').onclick=()=>{if(!selected.size)return;pushUndo();const idx=[...selected];const cl=idx.map(i=>{const c=JSON.parse(JSON.stringify(pages[current].shapes[i]));moveShape(c,24,24);return c});pages[current].shapes.push(...cl);selected=new Set(pages[current].shapes.slice(-cl.length).map((_,i)=>pages[current].shapes.length-cl.length+i));activeIndices=new Set(selected);cacheValid=false;requestRender();updatePanel();scheduleSave()};
document.getElementById('deleteEdit').onclick=()=>{if(!selected.size)return;pushUndo();pages[current].shapes=pages[current].shapes.filter((_,i)=>!selected.has(i));selected.clear();activeIndices.clear();cacheValid=false;requestRender();updatePanel();scheduleSave()};

document.getElementById('addPage').onclick=()=>{storeNote();const n=prompt('Đặt tên trang mới:','Trang '+(pages.length+1));if(n===null)return;pages.push(blankPage(n.trim()||('Trang '+(pages.length+1))));selectPage(pages.length-1)};
document.getElementById('renamePage').onclick=()=>renamePage(current);
document.getElementById('resetPage').onclick=()=>{if(!confirm('Reset trang hiện tại?'))return;pages[current]=blankPage(pages[current].name);selected.clear();activeIndices.clear();cacheValid=false;note.value='';renderPages();requestRender();updatePanel();scheduleSave()};
document.getElementById('deletePage').onclick=()=>{if(pages.length<=1){pages[0]=blankPage(pages[0].name);selectPage(0);return}if(!confirm('Xóa trang?'))return;pages.splice(current,1);selectPage(Math.max(0,current-1))};
document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.download=(pages[current].name||'geosketch')+'.png';const ai=activeIndices;activeIndices.clear();cacheValid=false;buildCache();a.href=cache.toDataURL('image/png');a.click();activeIndices=ai;cacheValid=false;requestRender()};
document.getElementById('gridBtn').onclick=()=>{grid=!grid;localStorage.setItem('geosketchGrid',grid?'1':'0');cacheValid=false;requestRender()};
document.getElementById('themeBtn').onclick=()=>{dark=!dark;document.body.classList.toggle('dark',dark);localStorage.setItem('geosketchDark',dark?'1':'0');cacheValid=false;requestRender()};
note.addEventListener('input',()=>{pages[current].note=note.value;scheduleSave()});

load();resize();
</script>
</body>
</html>
